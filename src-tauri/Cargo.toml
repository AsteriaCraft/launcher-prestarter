[package]
name = "Prestarter"
version = "0.3.0"
description = "Asterium prestarter: installs Java and starts the Asterium launcher"
authors = ["Asterium"]
license = "MIT"
repository = "https://github.com/AsteriaCraft/launcher-prestarter"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
# The `_lib` suffix keeps the lib name apart from the `Prestarter` bin (cargo issue 8519 on Windows).
name = "prestarter_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS through rustls with the ring provider and the OS certificate store (rustls-platform-verifier): no OpenSSL in the
# Linux binary, and aws-lc-rs (reqwest 0.13's default provider) would need a C/asm cross-build for Windows ARM64.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "blocking", "http2", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1.0.9"
# Digests (sha1 for the Liberica API, sha256) and Ed25519 verification of the signed policy: the same ring that
# rustls already uses, so no second crypto library.
ring = "0.17.14"
url = "2.5"
base64 = "0.22"
semver = "1.0.28"
thiserror = "2.0"
# Still used by the 0.2 modules until the app is rewired.
anyhow = "1.0"
log = { version = "0.4.28", features = ["std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4.46"
flate2 = "1.1.10"
dirs = "7.0.0"
dunce = "1.0.5"
sys-locale = "0.3.2"
chrono = { version = "0.4.41", default-features = false, features = ["serde", "clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# unwind (not abort): a panic is caught, written to the log and shown to the player instead of a silent exit.
panic = "unwind"
