# Release pipeline (ADR 0009). Trigger: a push to `release` (the owner merges the main -> release PR). The version
# comes from src-tauri/tauri.conf.json and the release is the tag v<version>. A version that already has a tag or a
# published release is NEVER overwritten, and a version that is not above the newest stable release is never
# published: the run fails and asks for a version bump. (The LaunchServer module AsteriumReleases refuses a tag whose
# content changes and never goes below the highest version it installed, and players must never get two different
# builds under one version.)
#
# Jobs, each with only the permissions it needs; no caches anywhere, so nothing another branch can write reaches a
# signed binary:
#   version     - one version everywhere, dated CHANGELOG.md + release notes, refuse an existing or lower tag
#   build       - build.yml: all seven artifacts (macOS signed ad hoc)                          contents: read
#   sign-macos  - environment `release`: Developer ID + notarization of the app and the DMG when all five APPLE_*
#                 secrets exist, otherwise the ad hoc DMG with a notice; some-but-not-all fails   contents: read
#   smoke       - smoke.yml on exactly these bytes (the signed DMG for macOS)                    contents: read
#   publish     - environment `release`: SHA256SUMS.txt, release.json with per-asset metadata, the signed policy,
#                 Ed25519 signature, build provenance attestation (public repository), draft -> upload -> publish
#
# Secrets, all in the GitHub Environment `release` only (deployable from the branch `release`; scripts/setup-repository.sh
# sets it up): RELEASE_SIGNING_KEY, one line of base64 of the Ed25519 private key in DER form, whose public half is
# .github/release-signing.pub.pem (compiled into the prestarter for the policy check, and trusted by the LaunchServer);
# APPLE_*. A repository-wide RELEASE_SIGNING_KEY would be readable by a workflow on any branch, so the version job
# refuses to start while one exists. Once the public key is committed, a missing signing secret fails the run before
# anything is published.
# All actions are pinned to full commit SHAs (tag in the comment).
name: publish

on:
  push:
    branches:
      - release

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: The signing key lives only in the environment release
        env:
          # This job has no environment, so only a repository (or organisation) secret is visible here; the step gets
          # true or false, never the value.
          REPOSITORY_KEY_SET: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$REPOSITORY_KEY_SET" = true ]; then
            echo "::error::RELEASE_SIGNING_KEY is a repository secret: a workflow on any branch can read the key the LaunchServer trusts. Nothing was published. Move it into the environment release with scripts/setup-repository.sh, then re-run this workflow."
            exit 1
          fi
          echo "RELEASE_SIGNING_KEY is not a repository secret"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: One version, dated changelog, release notes; refuse to overwrite or go back
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(bash scripts/ci/release-checks.sh --release)"
          # Fails closed: only a definite 404 counts as "not released yet".
          state="$(bash scripts/ci/tag-state.sh "$GH_REPO" "v$version")" || exit 1
          if [ "$state" != absent ]; then
            echo "::error::v$version is already released. Bump the version in src-tauri/tauri.conf.json (and package.json, Cargo.toml): a published release is never overwritten."
            exit 1
          fi
          # A stable release becomes GitHub's Latest: it must be higher than every stable release so far, or the
          # /releases/latest link would go back a version (and LaunchServers, which never go below the highest
          # version they installed, would refuse it). A failed lookup stops the run (bash -e).
          tags="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')"
          newest="$({ grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<< "$tags" || true; } | sed 's/^v//' | sort -V | tail -n 1)"
          core="${version%%-*}"
          if [ -n "$newest" ] && { [ "$core" = "$newest" ] || [ "$(printf '%s\n' "$newest" "$core" | sort -V | tail -n 1)" != "$core" ]; }; then
            echo "::error::v$version is not above the newest release v$newest. Bump the version in src-tauri/tauri.conf.json (and package.json, Cargo.toml) above it."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    # A called workflow gets at most what its caller job grants, and the workflow-wide default above is none:
    # without this GitHub refuses to start the run (startup_failure of v0.3.0-rc.1, 2026-10-03).
    permissions:
      contents: read
    with:
      cache: false

  sign-macos:
    name: macOS signing (environment release)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asterium-macos
          path: dist
      - name: Sign, notarize and staple (or keep the ad hoc build with a notice)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          tar -xf dist/Asterium.app.tar -C dist
          bash scripts/ci/macos-signing.sh auto dist/Asterium.app dist/Asterium-macos-universal.dmg
          tar -C dist -cf dist/Asterium.app.tar Asterium.app
          echo "dist/Asterium-macos-universal.dmg $(stat -f %z dist/Asterium-macos-universal.dmg) bytes sha256 $(shasum -a 256 dist/Asterium-macos-universal.dmg | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asterium-macos-release
          path: |
            dist/Asterium-macos-universal.dmg
            dist/Asterium.app.tar
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke
    needs: sign-macos
    uses: ./.github/workflows/smoke.yml
    permissions:
      contents: read
    with:
      macos-artifact: asterium-macos-release

  publish:
    name: Checksums, signatures, attestation, release
    needs: [version, build, sign-macos, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prestarter-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asterium-macos-release
          path: dist

      - name: Release notes and the signed policy
        run: |
          cp "release-notes/${VERSION%%-*}.json" dist/release-notes.json
          bash scripts/ci/make-policy.sh "$VERSION" dist/prestarter-policy.json
          rm -f dist/Asterium.app.tar
          ls -l dist

      - name: SHA256SUMS.txt and release.json (schema 1, per-asset os/arch/format/role)
        run: |
          bash scripts/ci/release-manifest.sh dist "$GITHUB_REPOSITORY" prestarter "$VERSION" "$GITHUB_SHA" \
            Prestarter.exe:windows:x86_64:exe:prestarter \
            Prestarter-windows-aarch64.exe:windows:aarch64:exe:prestarter \
            Prestarter-linux-x86_64:linux:x86_64:elf:prestarter \
            Prestarter-linux-aarch64:linux:aarch64:elf:prestarter \
            Asterium-linux-x86_64.AppImage:linux:x86_64:appimage:download \
            Asterium-linux-aarch64.AppImage:linux:aarch64:appimage:download \
            Asterium-macos-universal.dmg:macos:universal:dmg:download \
            release-notes.json:-:-:json:notes \
            prestarter-policy.json:-:-:json:policy

      - name: Sign release.json (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set +e
          bash scripts/ci/sign-release.sh dist
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            # Unsigned only before signing is set up. Once the public key is committed, a missing secret (deleted,
            # renamed, not set in a new repository) stops the run here, before anything is published: a LaunchServer
            # would refuse the unsigned release, and a published version is never published again.
            if [ -f .github/release-signing.pub.pem ]; then
              echo "::error file=.github/release-signing.pub.pem::RELEASE_SIGNING_KEY is not set, but .github/release-signing.pub.pem is committed. Nothing was published: put the existing key into the environment release (scripts/setup-repository.sh with its offline backup), then re-run the failed jobs."
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set: $TAG is published WITHOUT release.json.sig. A LaunchServer running AsteriumReleases will not install it. Create the key with scripts/make-release-signing-key.sh (into the environment release)."
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      - name: Build provenance attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Prestarter.exe
            dist/Prestarter-windows-aarch64.exe
            dist/Prestarter-linux-x86_64
            dist/Prestarter-linux-aarch64
            dist/Asterium-linux-x86_64.AppImage
            dist/Asterium-linux-aarch64.AppImage
            dist/Asterium-macos-universal.dmg
            dist/release-notes.json
            dist/prestarter-policy.json
            dist/release.json

      - name: Publish (draft, upload, then publish)
        run: |
          # Never overwrite: an existing tag fails the run. A draft left by an earlier failed run was never public
          # and is replaced. The tag lookup fails closed (scripts/ci/tag-state.sh).
          state="$(bash scripts/ci/tag-state.sh "$GH_REPO" "$TAG")" || exit 1
          if [ "$state" != absent ]; then
            echo "::error::$TAG is already released. Bump the version in src-tauri/tauri.conf.json: a published release is never overwritten."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            echo "::notice::Replacing the unpublished draft $TAG left by an earlier failed run"
            gh release delete "$TAG" --yes
          fi
          assets=(dist/Prestarter.exe dist/Prestarter-windows-aarch64.exe dist/Prestarter-linux-x86_64 dist/Prestarter-linux-aarch64
                  dist/Asterium-linux-x86_64.AppImage dist/Asterium-linux-aarch64.AppImage dist/Asterium-macos-universal.dmg
                  dist/release-notes.json dist/prestarter-policy.json dist/SHA256SUMS.txt dist/release.json)
          signature="unsigned"
          if [ -f dist/release.json.sig ]; then
            assets+=(dist/release.json.sig)
            signature="release.json.sig (Ed25519)"
          fi
          {
            echo "Asterium prestarter $TAG, built from ${GITHUB_SHA::7}."
            echo
            echo "| Asset | Role | SHA-256 |"
            echo "|---|---|---|"
            jq -r '.assets[] | "| \(.name) | \(.role // "-") | `\(.sha256)` |"' dist/release.json
            echo
            echo "Signed manifest: release.json, signature: $signature."
            echo "Verify: \`sha256sum -c SHA256SUMS.txt\`, \`openssl pkeyutl -verify -rawin -pubin -inkey .github/release-signing.pub.pem -in release.json -sigfile release.json.sig\`, \`gh attestation verify <file> -R $GH_REPO\`."
            echo
            echo "Player notes (uk/en): release-notes.json. Developer changelog: CHANGELOG.md."
          } > "$RUNNER_TEMP/notes.md"
          # A -suffix version (0.3.0-rc.1) is a pre-release: never "latest", so production LaunchServers ignore it.
          kind=(--latest)
          case "$VERSION" in *-*) kind=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" "${assets[@]}" --draft --target "$GITHUB_SHA" --title "Prestarter $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"
          gh release edit "$TAG" --draft=false "${kind[@]}"
          echo "Published $TAG ($signature)"
